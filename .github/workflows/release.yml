name: Release to Maven Central

on:
  release:
    types: [created]

jobs:
  publish:
    strategy:
      matrix:
        include:
          - jdk-version: '8'
            project-dir: 'http-log-snap-jdk1.8'
            artifact-id: 'http-log-snap-jdk8'
            tag-suffix: '-jdk8'
          - jdk-version: '21'
            project-dir: 'http-log-snap-jdk21'
            artifact-id: 'http-log-snap'
            tag-suffix: ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code (initial)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine checkout ref
        id: checkout-ref
        run: |
          # Release 事件：从 release tag 生成对应的 tag
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          
          if [ "${{ matrix.jdk-version }}" = "8" ]; then
            # JDK 8: release tag + -jdk8 后缀
            # 例如: 0.0.11 -> 0.0.11-jdk8
            JDK8_TAG="${RELEASE_TAG}-jdk8"
            echo "Checking if tag ${JDK8_TAG} exists..."
            if git ls-remote --tags origin | grep -q "refs/tags/${JDK8_TAG}"; then
              echo "ref=${JDK8_TAG}" >> $GITHUB_OUTPUT
              echo "✓ Found tag: ${JDK8_TAG}"
            else
              echo "✗ ERROR: Required tag ${JDK8_TAG} not found!"
              echo "Please create tag ${JDK8_TAG} before releasing."
              exit 1
            fi
          else
            # JDK 21: 直接使用 release tag
            # 例如: 0.0.11 -> 0.0.11
            echo "ref=${RELEASE_TAG}" >> $GITHUB_OUTPUT
            echo "✓ Using tag: ${RELEASE_TAG}"
          fi
          
          # 保存 release tag 供后续步骤使用
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Checkout code (target ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Verify code consistency (JDK 8 only)
        if: matrix.jdk-version == '8'
        run: |
          RELEASE_TAG="${{ steps.checkout-ref.outputs.release_tag }}"
          JDK8_TAG="${{ steps.checkout-ref.outputs.ref }}"
          
          echo "Verifying that ${JDK8_TAG} is based on ${RELEASE_TAG}..."
          
          # 获取两个 tag 的 commit hash
          RELEASE_COMMIT=$(git rev-parse ${RELEASE_TAG} 2>/dev/null)
          JDK8_COMMIT=$(git rev-parse ${JDK8_TAG} 2>/dev/null)
          
          if [ -z "$RELEASE_COMMIT" ]; then
            echo "✗ ERROR: Tag ${RELEASE_TAG} not found in repository!"
            exit 1
          fi
          
          if [ -z "$JDK8_COMMIT" ]; then
            echo "✗ ERROR: Tag ${JDK8_TAG} not found in repository!"
            exit 1
          fi
          
          echo "Release tag ${RELEASE_TAG} points to: ${RELEASE_COMMIT}"
          echo "JDK 8 tag ${JDK8_TAG} points to: ${JDK8_COMMIT}"
          
          # 检查 JDK 8 tag 是否包含 release tag 的所有 commit
          # 使用 git merge-base 来检查
          MERGE_BASE=$(git merge-base ${RELEASE_TAG} ${JDK8_TAG} 2>/dev/null)
          
          if [ -z "$MERGE_BASE" ]; then
            echo "✗ ERROR: Tags ${RELEASE_TAG} and ${JDK8_TAG} have no common ancestor!"
            exit 1
          fi
          
          echo "Common ancestor: ${MERGE_BASE}"
          
          # 检查 release tag 的 commit 是否是 JDK 8 tag 的祖先（或相同）
          if git merge-base --is-ancestor ${RELEASE_TAG} ${JDK8_TAG} 2>/dev/null; then
            echo "✓ Verified: ${JDK8_TAG} is based on ${RELEASE_TAG}"
          else
            echo "✗ ERROR: ${JDK8_TAG} is NOT based on ${RELEASE_TAG}!"
            echo "The JDK 8 version must include all commits from the JDK 21 version."
            echo "Please ensure ${JDK8_TAG} is created from a commit that includes ${RELEASE_TAG}."
            exit 1
          fi

      - name: Display version information
        run: |
          echo "Release tag: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"
          echo "Release body: ${{ github.event.release.body }}"
          echo "Building JDK ${{ matrix.jdk-version }} version in ${{ matrix.project-dir }}"
          echo "Artifact ID: ${{ matrix.artifact-id }}"
          echo "Checkout ref: ${{ steps.checkout-ref.outputs.ref }}"
          echo "Current branch/tag: $(git rev-parse --abbrev-ref HEAD 2>/dev/null || git describe --tags --exact-match HEAD 2>/dev/null || echo 'detached')"
          echo "Current working directory: $(pwd)"
          echo "Listing directory contents:"
          ls -la
          echo "Checking if ${{ matrix.project-dir }} exists:"
          if [ -d "${{ matrix.project-dir }}" ]; then
            echo "✓ Directory ${{ matrix.project-dir }} exists"
            ls -la "${{ matrix.project-dir }}"
          else
            echo "✗ Directory ${{ matrix.project-dir }} does not exist"
            echo "Available directories:"
            find . -maxdepth 1 -type d | head -20
          fi

      - name: Set up JDK ${{ matrix.jdk-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk-version }}
          distribution: 'temurin'
          server-id: central
          server-username: ${{ secrets.CENTRAL_USERNAME }}
          server-password: ${{ secrets.CENTRAL_TOKEN }}

      - name: Configure GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            # 创建 GPG 目录
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            
            # 配置 GPG 以在批处理模式下工作（不使用代理）
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "batch" >> ~/.gnupg/gpg.conf
            echo "no-tty" >> ~/.gnupg/gpg.conf
            
            # 尝试直接导入（ASCII armor 格式）
            if echo "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
              echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
            else
              # 如果是 Base64 编码，先解码再导入
              echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --yes --import
            fi
            
            # 在 CI 环境中不需要显式信任密钥，GPG 会自动使用导入的密钥
            # 列出密钥以验证导入
            gpg --list-secret-keys --keyid-format LONG
          fi

      - name: Configure Maven settings
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.artifact-id }}-${{ hashFiles(format('{0}/pom.xml', matrix.project-dir)) }}
          restore-keys: |
            ${{ runner.os }}-m2-${{ matrix.artifact-id }}-
            ${{ runner.os }}-m2-

      - name: Build and publish to Maven Central
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 检查项目目录是否存在，如果不存在则使用当前目录（独立仓库情况）
          if [ -d "${{ matrix.project-dir }}" ]; then
            BUILD_DIR="${{ matrix.project-dir }}"
            echo "Using project directory: $BUILD_DIR"
          else
            BUILD_DIR="."
            echo "Project directory ${{ matrix.project-dir }} not found, using current directory (independent repository)"
          fi
          
          # 切换到构建目录并执行构建
          cd "$BUILD_DIR"
          echo "Building in directory: $(pwd)"
          mvn clean deploy \
            -DskipTests=false \
            -Dmaven.test.skip=false \
            -Dgpg.useagent=false \
            -DaltSnapshotDeploymentRepository=central::default::https://s01.oss.sonatype.org/content/repositories/snapshots \
            -DaltReleaseDeploymentRepository=central::default::https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/
