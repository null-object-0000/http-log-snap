name: Release to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.11)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Display version information
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "Release tag: ${{ github.event.release.tag_name }}"
            echo "Release name: ${{ github.event.release.name }}"
            echo "Release body: ${{ github.event.release.body }}"
          else
            echo "Manual trigger - Version: ${{ github.event.inputs.version }}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: ${{ secrets.CENTRAL_USERNAME }}
          server-password: ${{ secrets.CENTRAL_TOKEN }}

      - name: Configure GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            # 创建 GPG 目录
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            
            # 配置 GPG 以在批处理模式下工作（不使用代理）
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "batch" >> ~/.gnupg/gpg.conf
            echo "no-tty" >> ~/.gnupg/gpg.conf
            
            # 尝试直接导入（ASCII armor 格式）
            if echo "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
              echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
            else
              # 如果是 Base64 编码，先解码再导入
              echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --yes --import
            fi
            
            # 在 CI 环境中不需要显式信任密钥，GPG 会自动使用导入的密钥
            # 列出密钥以验证导入
            gpg --list-secret-keys --keyid-format LONG
          fi

      - name: Configure Maven settings
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and publish to Maven Central
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn clean deploy \
            -DskipTests=false \
            -Dmaven.test.skip=false \
            -Dgpg.passphrase=$GPG_PASSPHRASE \
            -Dgpg.useagent=false \
            -DaltSnapshotDeploymentRepository=central::default::https://s01.oss.sonatype.org/content/repositories/snapshots \
            -DaltReleaseDeploymentRepository=central::default::https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/

